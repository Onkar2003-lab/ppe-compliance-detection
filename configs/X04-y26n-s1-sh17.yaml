# DO NOT EDIT. Any change to these values = a new run-ID (run-ID contract).
#
# Grid: 3 nano families x 3 seeds x 2 directions = 18 runs, seed-major order.
# Trains on sh17; cross-evaluates on the other dataset automatically
# (src/run.py), so the transfer gap is produced by every run rather than a later pass.
